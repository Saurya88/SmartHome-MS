server:
  port: 8084

spring:
  application:
    name: scene-orchestrator-service

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/scene_orchestrator_db}

microservices:
  automation:
    base-url: ${AUTOMATION_SERVICE_BASE_URL:http://localhost:8081}
  device:
    base-url: ${DEVICE_SERVICE_BASE_URL:http://localhost:8082}
  user:
    base-url: ${USER_SERVICE_BASE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info

