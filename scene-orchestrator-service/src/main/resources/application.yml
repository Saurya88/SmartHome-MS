server:
  port: 8084

spring:
  application:
    name: scene-orchestrator-service

  datasource:
    url: jdbc:h2:mem:sceneorchestratordb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: false

microservices:
  automation:
    base-url: http://localhost:8081
  device:
    base-url: http://localhost:8082
  user:
    base-url: http://localhost:8083
