services:
  user-permissions-db:
    image: mysql:8.4
    container_name: user-permissions-db
    environment:
      MYSQL_DATABASE: user_permissions_db
      MYSQL_USER: smarthome
      MYSQL_PASSWORD: smarthome
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - user-permissions-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-usmarthome", "-psmarthome"]
      interval: 10s
      timeout: 5s
      retries: 10

  device-db:
    image: postgres:16
    container_name: device-db
    environment:
      POSTGRES_DB: device_db
      POSTGRES_USER: smarthome
      POSTGRES_PASSWORD: smarthome
    volumes:
      - device-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarthome -d device_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  automation-db:
    image: mysql:8.4
    container_name: automation-db
    environment:
      MYSQL_DATABASE: automation_db
      MYSQL_USER: smarthome
      MYSQL_PASSWORD: smarthome
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - automation-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-usmarthome", "-psmarthome"]
      interval: 10s
      timeout: 5s
      retries: 10

  scene-orchestrator-db:
    image: mongo:7
    container_name: scene-orchestrator-db
    environment:
      MONGO_INITDB_DATABASE: scene_orchestrator_db
    volumes:
      - scene-orchestrator-db-data:/data/db
      - ./docker/mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "mongodb://localhost:27017/scene_orchestrator_db", "--eval", "db.runCommand({ ping: 1 }).ok" ]
      interval: 10s
      timeout: 10s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: smarthome-phpmyadmin
    environment:
      PMA_HOSTS: user-permissions-db,automation-db
      PMA_PORTS: 3306,3306
      PMA_USER: smarthome
      PMA_PASSWORD: smarthome
    depends_on:
      user-permissions-db:
        condition: service_healthy
      automation-db:
        condition: service_healthy

  mongo-express:
    image: mongo-express:1.0.2
    container_name: smarthome-mongo-express
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://scene-orchestrator-db:27017/scene_orchestrator_db
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      scene-orchestrator-db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: smarthome-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@smarthome.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      device-db:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    environment:
      SERVER_PORT: 8080
      USER_SERVICE_BASE_URL: http://user-permissions-service:8083
      DEVICE_SERVICE_BASE_URL: http://device-service:8082
      AUTOMATION_SERVICE_BASE_URL: http://automation-service:8081
      SCENE_ORCHESTRATOR_SERVICE_BASE_URL: http://scene-orchestrator-service:8084
    ports:
      - "8080:8080"
    depends_on:
      - user-permissions-service
      - device-service
      - automation-service
      - scene-orchestrator-service

  swagger-ui:
    image: swaggerapi/swagger-ui
    environment:
      - API_URL=http://api-gateway:8080/v3/api-docs
    depends_on:
      - api-gateway

  user-permissions-service:
    build:
      context: .
      dockerfile: user-permissions-service/Dockerfile
    container_name: user-permissions-service
    environment:
      SERVER_PORT: 8083
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://user-permissions-db:3306/user_permissions_db
      SPRING_DATASOURCE_USERNAME: smarthome
      SPRING_DATASOURCE_PASSWORD: smarthome
    depends_on:
      user-permissions-db:
        condition: service_healthy

  device-service:
    build:
      context: .
      dockerfile: device-service/Dockerfile
    container_name: device-service
    environment:
      SERVER_PORT: 8082
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://device-db:5432/device_db
      SPRING_DATASOURCE_USERNAME: smarthome
      SPRING_DATASOURCE_PASSWORD: smarthome
    depends_on:
      device-db:
        condition: service_healthy

  automation-service:
    build:
      context: .
      dockerfile: automation-service/Dockerfile
    container_name: automation-service
    environment:
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://automation-db:3306/automation_db
      SPRING_DATASOURCE_USERNAME: smarthome
      SPRING_DATASOURCE_PASSWORD: smarthome
    depends_on:
      automation-db:
        condition: service_healthy

  scene-orchestrator-service:
    build:
      context: .
      dockerfile: scene-orchestrator-service/Dockerfile
    container_name: scene-orchestrator-service
    environment:
      SERVER_PORT: 8084
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_MONGODB_URI: mongodb://scene-orchestrator-db:27017/scene_orchestrator_db
      AUTOMATION_SERVICE_BASE_URL: http://automation-service:8081
      DEVICE_SERVICE_BASE_URL: http://device-service:8082
      USER_SERVICE_BASE_URL: http://user-permissions-service:8083
    depends_on:
      scene-orchestrator-db:
        condition: service_healthy
      automation-service:
        condition: service_started
      device-service:
        condition: service_started
      user-permissions-service:
        condition: service_started

volumes:
  user-permissions-db-data:
  device-db-data:
  automation-db-data:
  scene-orchestrator-db-data:
  pgadmin-data:
