server:
  port: 8081

spring:
  application:
    name: automation-service

  datasource:
    url: jdbc:h2:mem:automationdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      data-locations: classpath:h2-data.sql