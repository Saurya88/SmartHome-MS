spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/device_db}
    username: ${SPRING_DATASOURCE_USERNAME:smarthome}
    password: ${SPRING_DATASOURCE_PASSWORD:smarthome}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: false

  sql:
    init:
      mode: never

  h2:
    console:
      enabled: false
